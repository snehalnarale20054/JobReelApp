name: job_reels
description: Free Job + Reels Platform — Indian blue-collar job marketplace with short video feed.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Supabase
  supabase_flutter: ^2.5.6

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Fonts (Noto Sans supports Devanagari for Hindi/Marathi)
  google_fonts: ^6.2.1

  # Internationalisation
  intl: ^0.20.3

  # Persistence (locale preference)
  shared_preferences: ^2.3.2

  # Phase 1 — Reels feed
  video_player: ^2.9.1 # HLS video playback (Android native)
  share_plus: ^10.0.2 # Share reel URL via system sheet
  cached_network_image: ^3.4.1 # Thumbnail while video loads

  # Phase 2 — Identity & Resume
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true # enables ARB → dart code generation

  assets:
    - .env
